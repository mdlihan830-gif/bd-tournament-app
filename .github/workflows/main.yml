name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Setup App
        run: |
          npm install
          npx cap add android

      - name: Auto Fix Names & Generate Launcher Icon
        run: |
          mkdir -p assets
          # Auto-detect your uploaded icon file
          if [ -f "icon..png" ]; then
            cp "icon..png" assets/icon.png
          elif [ -f "icon.png.png" ]; then
            cp "icon.png.png" assets/icon.png
          elif [ -f "icon.png" ]; then
            cp "icon.png" assets/icon.png
          fi

          if [ -f "assets/icon.png" ]; then
            npm install -D @capacitor/assets
            npx @capacitor/assets generate --android --iconOnly
            echo "Logo generated successfully!"
          fi

          # Auto-detect google services file even with (1)
          if [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" android/app/google-services.json
            echo "Google services mapped successfully!"
          elif [ -f "google-services.json" ]; then
            cp "google-services.json" android/app/google-services.json
            echo "Google services mapped successfully!"
          fi

          npx cap sync

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-TOURNAMENT-APP
          path: android/app/build/outputs/apk/debug/app-debug.apk
