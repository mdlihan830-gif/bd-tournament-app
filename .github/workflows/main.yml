name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Setup Android
        run: |
          npm install
          npx cap add android

      - name: Auto Resize & Convert Icon to Clean PNGs
        run: |
          python3 -m pip install pillow
          python3 -c "
          import os
          from PIL import Image

          icon_path = None
          for f in ['icon..png', 'icon.png.png', 'icon.png', 'icon.jpg', 'icon.jpeg']:
              if os.path.exists(f):
                  icon_path = f
                  break

          if icon_path:
              print(f'Found icon: {icon_path}')
              img = Image.open(icon_path).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in sizes.items():
                  p = os.path.join('android/app/src/main/res', folder)
                  if os.path.exists(p):
                      r_img = img.resize((size, size), Image.Resampling.LANCZOS)
                      r_img.save(os.path.join(p, 'ic_launcher.png'), 'PNG')
                      r_img.save(os.path.join(p, 'ic_launcher_round.png'), 'PNG')
                      fg_size = int(size * 108 / 48)
                      fg_img = img.resize((fg_size, fg_size), Image.Resampling.LANCZOS)
                      fg_img.save(os.path.join(p, 'ic_launcher_foreground.png'), 'PNG')
              print('All Android icons created successfully!')
          else:
              print('No icon found, keeping default.')
          "

      - name: Setup Google Services (Safe Mode)
        run: |
          if [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" android/app/google-services.json || true
          elif [ -f "google-services.json" ]; then
            cp "google-services.json" android/app/google-services.json || true
          fi
          npx cap sync

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-TOURNAMENT-APP
          path: android/app/build/outputs/apk/debug/app-debug.apk
