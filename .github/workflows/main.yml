name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Setup App
        run: |
          npm install
          npx cap add android

      - name: Configure Icon & Google Services
        run: |
          # 1. Auto-detect and replace launcher icons
          ICON_FILE=""
          for f in "icon..png" "icon.png.png" "icon.png"; do
            if [ -f "$f" ]; then
              ICON_FILE="$f"
              break
            fi
          done

          if [ -n "$ICON_FILE" ]; then
            echo "Found icon: $ICON_FILE"
            for dir in android/app/src/main/res/mipmap-*; do
              if [ "$dir" != "android/app/src/main/res/mipmap-anydpi-v26" ]; then
                cp "$ICON_FILE" "$dir/ic_launcher.png" || true
                cp "$ICON_FILE" "$dir/ic_launcher_round.png" || true
                cp "$ICON_FILE" "$dir/ic_launcher_foreground.png" || true
              fi
            done
            echo "All launcher icons replaced successfully!"
          fi

          # 2. Auto-detect and copy google-services.json
          if [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" android/app/google-services.json || true
            echo "Mapped google-services (1).json"
          elif [ -f "google-services.json" ]; then
            cp "google-services.json" android/app/google-services.json || true
            echo "Mapped google-services.json"
          fi

          npx cap sync

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-TOURNAMENT-APP
          path: android/app/build/outputs/apk/debug/app-debug.apk
