name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Dependencies & Prepare Assets
      run: |
        npm install --legacy-peer-deps
        mkdir -p www
        cp index.html www/ 2>/dev/null || true
        cp -r assets www/ 2>/dev/null || true
        if [ ! -d "android" ]; then
          npx @capacitor/cli add android
        fi
        npx @capacitor/cli sync android

    - name: Inject Google Services
      run: |
        if [ -f "google-services.json" ]; then
          cp google-services.json android/app/
        elif [ -f "google-services (1).json" ]; then
          cp "google-services (1).json" android/app/google-services.json
        fi

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: BD-Tournament-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
